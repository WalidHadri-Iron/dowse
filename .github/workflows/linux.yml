# Dowse on Linux (x64, Ubuntu): the interface's checks and the tests (Tesseract installed, for the OCR test), the
# reference vectors on the processor and on Vulkan, and the desktop app's first start on an X display. A hosted runner
# has no GPU: Vulkan runs on Mesa's software driver (lavapipe), which shows the Vulkan build loads and computes the same
# vectors; a real GPU's speed isn't measured here.
name: Linux

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: Tesseract (the OCR Dowse uses on Linux, when it's installed)
        run: sudo apt-get update -q && sudo apt-get install -yq tesseract-ocr

      - name: The tests (without a model server)
        run: |
          uv sync
          uv run python -c "import platform, dowse; print(platform.platform(), platform.machine(), 'dowse', dowse.__version__)"
          uv run pytest -q -m "not server"

  # The vectors Linux makes must be the reference's (tests/reference: cosine ≥ 0.999), or a Linux index would disagree
  # with everyone else's.
  reference:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DOWSE_HOME: ${{ github.workspace }}/.dowse-home
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Cache the model (865 MB)
        uses: actions/cache@v4
        with:
          path: .dowse-home/Models
          key: dowse-models-${{ hashFiles('src/dowse/modelfiles.py') }}

      - name: The model and the processor's runtime
        run: |
          uv sync
          uv run dowse setup --backend cpu

      - name: Reference vectors on the processor
        run: DOWSE_BACKEND=cpu uv run pytest -q tests/test_reference.py

      - name: Reference vectors on Vulkan (Mesa's software driver)
        env:
          GGML_VK_VISIBLE_DEVICES: "0"   # llama.cpp leaves software Vulkan devices out unless they're named
        run: |
          sudo apt-get update -q && sudo apt-get install -yq mesa-vulkan-drivers libvulkan1
          uv run dowse setup --backend vulkan
          "$(uv run python -c 'from dowse import runtime; print(runtime.executable("vulkan"))')" --list-devices || true
          DOWSE_BACKEND=vulkan uv run pytest -q tests/test_reference.py

      - name: Indexed and searched from the command line
        run: |
          uv run dowse index tests/reference
          uv run dowse search "a lake between the mountains" | tee search.txt
          grep -q "landscape.jpg" search.txt

  # The desktop app's first start, as a person meets it (set up through its welcome: the runtime downloaded, a folder
  # chosen, opening at login), on an X display (Xvfb, with Openbox as the window manager): it reads the folder, finds
  # the photo, opens Quick search and the Library (screenshots), and quits with everything it started.
  app:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface (the app serves it)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: An X display, a window manager, and what Qt needs on a bare Ubuntu
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq xvfb openbox imagemagick libxcb-cursor0 libxkbcommon-x11-0 libxcb-icccm4 \
            libxcb-keysyms1 libxcb-image0 libxcb-render-util0 libxcb-xinerama0 libxcb-shape0 libegl1 libnss3 \
            libasound2t64

      - name: Cache the model (865 MB)
        uses: actions/cache@v4
        with:
          path: .dowse-home/Models
          key: dowse-models-${{ hashFiles('src/dowse/modelfiles.py') }}

      - name: The model
        env:
          DOWSE_HOME: ${{ github.workspace }}/.dowse-home
        run: |
          uv sync
          uv run python -c "from dowse import modelfiles; modelfiles.download()"

      - name: The app's first start, set up through its welcome (the model copied, the runtime downloaded)
        run: |
          home="$RUNNER_TEMP/first-home"
          mkdir -p "$home"
          cp -R .dowse-home/Models "$home/"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          openbox &
          DOWSE_HOME="$home" uv run python scripts/app_smoke.py "$RUNNER_TEMP/linux-app" --first-run

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-app
          path: |
            ${{ runner.temp }}/linux-app
            ${{ runner.temp }}/first-home/Logs

  # Dowse's AppImage (scripts/build_linux_app.py), built, then run as a person runs the file they downloaded (mounted
  # with FUSE), from its first start: the same checks as the app above, plus its processes on the AppImage's own Python,
  # opening at login pointing at the file (not where it's mounted this time), and Dowse in the apps menu.
  appimage:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: The X11 libraries the AppImage carries, FUSE to run it, an X display, and Qt's needs to check it
        run: |
          sudo apt-get update -q
          sudo apt-get install -yq libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-render-util0 \
            libxcb-util1 libxcb-xkb1 libxkbcommon-x11-0 fuse3 xvfb openbox imagemagick libegl1 libnss3 libasound2t64 \
            libxcb-xinerama0 libxcb-shape0

      - name: Cache the AppImage's downloads (its Python, appimagetool, the runtime) and the model (865 MB)
        uses: actions/cache@v4
        with:
          path: |
            build/cache
            .dowse-home/Models
          key: dowse-appimage-${{ hashFiles('scripts/build_linux_app.py', 'src/dowse/modelfiles.py') }}

      - name: Dowse's AppImage
        run: |
          uv sync
          uv run python scripts/build_linux_app.py
          ls -la dist/

      - name: The model
        env:
          DOWSE_HOME: ${{ github.workspace }}/.dowse-home
        run: uv run python -c "from dowse import modelfiles; modelfiles.download()"

      - name: The AppImage's first start, set up through its welcome
        run: |
          home="$RUNNER_TEMP/first-home"
          mkdir -p "$home"
          cp -R .dowse-home/Models "$home/"
          export DISPLAY=:99
          Xvfb :99 -screen 0 1280x800x24 &
          sleep 2
          openbox &
          image="$(ls "$PWD"/dist/Dowse-*.AppImage)"
          DOWSE_HOME="$home" uv run python scripts/app_smoke.py "$RUNNER_TEMP/appimage" --app "$image" --first-run
          grep -q "Exec=$image" "$HOME/.local/share/applications/dowse.desktop"   # Dowse in the apps menu

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-appimage-run
          path: |
            ${{ runner.temp }}/appimage
            ${{ runner.temp }}/first-home/Logs

      - name: AppImage
        uses: actions/upload-artifact@v4
        with:
          name: Dowse-linux
          path: dist/*.AppImage
