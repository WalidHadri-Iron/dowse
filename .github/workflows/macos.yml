# macOS, the first step towards a Mac version: the interface's checks and the tests (without a model server) on a
# clean Mac (Apple Silicon). Only in the public repository: macOS minutes are free for public repositories.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'WalidHadri-Iron/dowse'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: The tests (without a model server)
        run: |
          uv sync
          uv run python -c "import platform, dowse; print(platform.platform(), platform.machine(), 'dowse', dowse.__version__)"
          uv run pytest -q -m "not server"

  # The vectors a Mac makes must be the reference's (tests/reference: cosine ≥ 0.999), or a Mac's index would
  # disagree with everyone else's: on the processor and on Metal (a hosted Mac's GPU is a paravirtual Metal device).
  reference:
    if: github.repository == 'WalidHadri-Iron/dowse'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOWSE_HOME: ${{ github.workspace }}/.dowse-home
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface (the app serves it)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache the model (865 MB)
        uses: actions/cache@v4
        with:
          path: .dowse-home/Models
          key: dowse-models-${{ hashFiles('src/dowse/modelfiles.py') }}

      - name: The model and the processor's runtime
        run: |
          uv sync
          uv run dowse setup --backend cpu

      - name: Reference vectors on the processor
        run: DOWSE_BACKEND=cpu uv run pytest -q tests/test_reference.py

      - name: Reference vectors on Metal (the Apple GPU)
        run: |
          uv run dowse setup --backend metal
          "$(uv run python -c 'from dowse import runtime; print(runtime.executable("metal"))')" --list-devices || true
          DOWSE_BACKEND=metal uv run pytest -q tests/test_reference.py

      - name: The Mac app, started as a person starts it
        run: uv run python scripts/mac_smoke.py "$RUNNER_TEMP/mac-app"

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            ${{ runner.temp }}/mac-app
            .dowse-home/Logs
