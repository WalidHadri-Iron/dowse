# macOS, the first step towards a Mac version: the interface's checks and the tests (without a model server) on a
# clean Mac (Apple Silicon). Only in the public repository: macOS minutes are free for public repositories.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'WalidHadri-Iron/dowse'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: The tests (without a model server)
        run: |
          uv sync
          uv run python -c "import platform, dowse; print(platform.platform(), platform.machine(), 'dowse', dowse.__version__)"
          uv run pytest -q -m "not server"

  # The vectors a Mac makes must be the reference's (tests/reference: cosine ≥ 0.999), or a Mac's index would
  # disagree with everyone else's: on the processor and on Metal (a hosted Mac's GPU is a paravirtual Metal device).
  reference:
    if: github.repository == 'WalidHadri-Iron/dowse'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOWSE_HOME: ${{ github.workspace }}/.dowse-home
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface (the app serves it)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache the model (865 MB)
        uses: actions/cache@v4
        with:
          path: .dowse-home/Models
          key: dowse-models-${{ hashFiles('src/dowse/modelfiles.py') }}

      - name: The model and the processor's runtime
        run: |
          uv sync
          uv run dowse setup --backend cpu

      - name: Reference vectors on the processor
        run: DOWSE_BACKEND=cpu uv run pytest -q tests/test_reference.py

      - name: Reference vectors on Metal (the Apple GPU)
        run: |
          uv run dowse setup --backend metal
          "$(uv run python -c 'from dowse import runtime; print(runtime.executable("metal"))')" --list-devices || true
          DOWSE_BACKEND=metal uv run pytest -q tests/test_reference.py

      - name: The Mac app, started as a person starts it
        run: uv run python scripts/mac_smoke.py "$RUNNER_TEMP/mac-app"

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            ${{ runner.temp }}/mac-app
            .dowse-home/Logs

  # Dowse.app and its disk image (scripts/build_mac_app.py), installed from the image as a person installs it, set up
  # with its own command line, and started as Finder starts it. Signed ad hoc until there's a Developer ID: then the
  # DOWSE_MAC_IDENTITY and DOWSE_NOTARY_PROFILE the builder reads (secrets, a keychain imported first) sign and notarize.
  app:
    if: github.repository == 'WalidHadri-Iron/dowse'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOWSE_HOME: ${{ github.workspace }}/.dowse-home
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache the app's downloads (its Python) and the model (865 MB)
        uses: actions/cache@v4
        with:
          path: |
            build/cache
            .dowse-home/Models
          key: dowse-mac-app-${{ hashFiles('scripts/build_mac_app.py', 'src/dowse/modelfiles.py') }}

      - name: Dowse.app and its disk image
        run: |
          uv sync
          uv run python scripts/build_mac_app.py
          du -sh dist/Dowse.app dist/*.dmg

      - name: Installed from the disk image
        run: |
          mount="$(mktemp -d)"
          hdiutil attach dist/Dowse-*.dmg -nobrowse -readonly -mountpoint "$mount"
          mkdir -p "$HOME/Applications"
          ditto "$mount/Dowse.app" "$HOME/Applications/Dowse.app"
          hdiutil detach "$mount"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Dowse.app"
          "$HOME/Applications/Dowse.app/Contents/MacOS/Dowse" -m dowse.cli setup --backend metal

      - name: The installed app's first start, set up through its welcome (the model copied, the runtime downloaded)
        run: |
          home="$RUNNER_TEMP/first-home"
          mkdir -p "$home"
          cp -R .dowse-home/Models "$home/"
          DOWSE_HOME="$home" uv run python scripts/mac_smoke.py "$RUNNER_TEMP/mac-app" --app "$HOME/Applications/Dowse.app" --first-run

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-installed-app
          path: |
            ${{ runner.temp }}/mac-app
            ${{ runner.temp }}/first-home/Logs

      - name: Disk image
        uses: actions/upload-artifact@v4
        with:
          name: Dowse-mac
          path: dist/*.dmg
