# Dowse on a Mac (Apple Silicon): the interface's checks and the tests, the reference vectors on the processor and on
# Metal, the app started from the source, and Dowse.app built, installed from its disk image and set up as a person
# does. Only in the public repository: macOS minutes are free for public repositories.
name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository == 'WalidHadri-Iron/dowse'
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface
        working-directory: web
        run: |
          npm ci
          npm run check
          npm test
          npm run build

      - name: The tests (without a model server)
        run: |
          uv sync
          uv run python -c "import platform, dowse; print(platform.platform(), platform.machine(), 'dowse', dowse.__version__)"
          uv run pytest -q -m "not server"

  # The vectors a Mac makes must be the reference's (tests/reference: cosine ≥ 0.999), or a Mac's index would
  # disagree with everyone else's: on the processor and on Metal (a hosted Mac's GPU is a paravirtual Metal device).
  reference:
    if: github.repository == 'WalidHadri-Iron/dowse'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOWSE_HOME: ${{ github.workspace }}/.dowse-home
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface (the app serves it)
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache the model (865 MB)
        uses: actions/cache@v4
        with:
          path: .dowse-home/Models
          key: dowse-models-${{ hashFiles('src/dowse/modelfiles.py') }}

      - name: The model and the processor's runtime
        run: |
          uv sync
          uv run dowse setup --backend cpu

      - name: Reference vectors on the processor
        run: DOWSE_BACKEND=cpu uv run pytest -q tests/test_reference.py

      - name: Reference vectors on Metal (the Apple GPU)
        run: |
          uv run dowse setup --backend metal
          "$(uv run python -c 'from dowse import runtime; print(runtime.executable("metal"))')" --list-devices || true
          DOWSE_BACKEND=metal uv run pytest -q tests/test_reference.py

      - name: The Mac app, started as a person starts it
        run: uv run python scripts/mac_smoke.py "$RUNNER_TEMP/mac-app"

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-app
          path: |
            ${{ runner.temp }}/mac-app
            .dowse-home/Logs

  # Dowse.app and its disk image (scripts/build_mac_app.py), installed from the image as a person installs it, and
  # started for the first time as Finder starts it. Signed ad hoc until the repository has a Developer ID's secrets:
  #   MAC_CERTIFICATE            the "Developer ID Application" certificate and its key, exported as .p12, base64
  #   MAC_CERTIFICATE_PASSWORD   the .p12's password
  #   MAC_IDENTITY               its name, "Developer ID Application: <name> (<team id>)"
  #   APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD   for Apple's notary service (an app-specific password)
  # Then it's signed with the hardened runtime, notarized, stapled, and Gatekeeper must accept it.
  app:
    if: github.repository == 'WalidHadri-Iron/dowse'
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DOWSE_HOME: ${{ github.workspace }}/.dowse-home
      SIGNED: ${{ secrets.MAC_CERTIFICATE != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: The interface
        working-directory: web
        run: |
          npm ci
          npm run build

      - name: Cache the app's downloads (its Python) and the model (865 MB)
        uses: actions/cache@v4
        with:
          path: |
            build/cache
            .dowse-home/Models
          key: dowse-mac-app-${{ hashFiles('scripts/build_mac_app.py', 'src/dowse/modelfiles.py') }}

      - name: The Developer ID and the notary's credentials, in a keychain of this run's
        if: env.SIGNED == 'true'
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          MAC_IDENTITY: ${{ secrets.MAC_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password="$(uuidgen)"
          echo "$MAC_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/identity.p12"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/identity.p12" -P "$MAC_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/identity.p12"
          xcrun notarytool store-credentials dowse-notary --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" --keychain "$keychain"
          echo "DOWSE_MAC_IDENTITY=$MAC_IDENTITY" >> "$GITHUB_ENV"
          echo "DOWSE_NOTARY_PROFILE=dowse-notary" >> "$GITHUB_ENV"
          echo "DOWSE_NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Dowse.app and its disk image
        run: |
          uv sync
          uv run python scripts/build_mac_app.py
          du -sh dist/Dowse.app dist/*.dmg

      - name: Installed from the disk image
        run: |
          mount="$(mktemp -d)"
          hdiutil attach dist/Dowse-*.dmg -nobrowse -readonly -mountpoint "$mount"
          mkdir -p "$HOME/Applications"
          ditto "$mount/Dowse.app" "$HOME/Applications/Dowse.app"
          hdiutil detach "$mount"
          codesign --verify --deep --strict --verbose=2 "$HOME/Applications/Dowse.app"
          if [ "$SIGNED" = true ]; then   # what a downloaded copy meets: Gatekeeper, and the notary's ticket
            xcrun stapler validate dist/Dowse-*.dmg
            spctl --assess --type execute --verbose=2 "$HOME/Applications/Dowse.app"
          fi
          "$HOME/Applications/Dowse.app/Contents/MacOS/Dowse" -m dowse.cli setup --backend metal

      - name: The installed app's first start, set up through its welcome (the model copied, the runtime downloaded)
        run: |
          home="$RUNNER_TEMP/first-home"
          mkdir -p "$home"
          cp -R .dowse-home/Models "$home/"
          DOWSE_HOME="$home" uv run python scripts/mac_smoke.py "$RUNNER_TEMP/mac-app" --app "$HOME/Applications/Dowse.app" --first-run

      - name: Screenshots and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mac-installed-app
          path: |
            ${{ runner.temp }}/mac-app
            ${{ runner.temp }}/first-home/Logs

      - name: Disk image
        uses: actions/upload-artifact@v4
        with:
          name: Dowse-mac
          path: dist/*.dmg
